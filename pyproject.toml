[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "optiplot-workbench"
version = "0.2.0"
description = "Explainable local scientific plotting workbench for optics research"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "OptiPlot contributors"}]
dependencies = ["numpy>=1.24,<3", "pandas>=2.0,<4", "matplotlib>=3.7,<4", "scipy>=1.10,<2", "openpyxl>=3.1,<4", "Pillow>=9.5,<12"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
optiplot = "optiplot.cli:main"

[tool.setuptools.packages.find]
include = ["optiplot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
